# Site estático: as páginas são geradas por build.py a partir de src/ (já estão no repositório).
[build]
  publish = "_site"
  # Publica só o site: as páginas, assets/ e fotos/web/. O dossier, os originais e as ferramentas ficam de fora.
  command = "python3 build.py && rm -rf _site && mkdir -p _site/fotos && cp *.html _site/ && cp -R assets _site/assets && cp -R fotos/web _site/fotos/web && rm -f _site/fotos/web/LEIA-ME.md _site/fotos/web/_resumo.jpg _site/fotos/web/touca-antiga-recorte/_previa.jpg"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fotos/web/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
